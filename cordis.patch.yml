# dsh-purge bundle patch
#
# 清洗 + 演练台都在本插件内（lib/redteam、presets/redteam、skills/redteam）。
# 只装 dsh-purge，不外接、不 link 其它红队包。

# 关掉旧的独立红队包行（若用户以前装过 dsh-redteam-mode）
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    # dsh 0.2.1+ 不再注册 {{cwd}} 变量（只剩 provider / model），
    # 残留引用会让整轮 prompt 组装直接失败。工作目录由 working-directory 服务提供。
    personaSuffix: ""

- id: dsh-purge
  inject: [systemPrompt, tools]

- insert:
    - id: dsh-purge
      name: 'dsh-purge'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "继续"
        capabilityProtocol: true
        hooksDenyBypass: true
        # 深度层开关（改完重启生效）
        deepPurge: true              # 总开关：历史拒绝清洗 + 遗迹剥离
        refusalFilter: true          # 把历史里的拒绝回复改写成「已作废」
        stripPrefillArtifacts: true  # 剥掉历史里残留的「可以，」/「Yes. 」开头
        tailSteer: false             # 尾棘轮（追加到真实用户消息末尾，默认关）
        prefillMode: "off"           # assistant 预填充：off / always（默认关）
        # system 层开关
        tailAnchor: true             # 末尾追加 dshpg-anchor
        safetyFilter: true           # 纯安全段整段下线（段名 + 词根密度双判）
        identityParagraphPurge: true # 结构性剥离官方身份段

    # 演练台：预设 + 技能落地（本插件 lib/redteam）
    - id: dsh-purge-redteam
      name: dsh-purge/redteam

    # 演练台事实库（SQLite），数据在 $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: dsh-purge/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # 演练台 HTTP 桥 POST /redteam/api
    - id: dsh-purge-redteam-ui
      name: dsh-purge/redteam/ui
